 return`<label>Lançar férias para${APR?'':' ('+GN[gMeu()]+')'}<select id="pp" onchange="S.me=+this.value;sv();render()">${gs.map(g=>{const L=S.p.filter(p=>grp(p)==g);return L.length?`<optgroup label="${GN[g]}">${L.map(p=>`<option value="${p.id}" ${p.id==S.me?'selected':''}>${xe(p.n)}${MEL==p.id?' (eu)':''}</option>`).join('')}</optgroup>`:''}).join('')}</select></label>`}
function Pret(){
 const o=S.p.map(p=>`<option value="${p.id}" ${p.id==S.me?'selected':''}>${p.n} (${p.cg} · ${p.t||'—'} · ${p.nv||'—'})</option>`).join(''),c=S.p.map(p=>`<option value="${p.id}">${p.n}</option>`).join('');
 const opt=k=>`<div class="card"><b>${k}ª opção</b><div class="row"><label>Data início<input type="date" id="i${k}" min="${YMIN}-01-01" max="${YMAX}-12-31" oninput="live()"></label><label>Dias (10/20/30)<input type="number" id="d${k}" value="${k==1?20:10}" style="width:80px" oninput="live()"></label><label>Data fim<input id="f${k}" disabled style="width:130px"></label><label>Quem cobre<select id="c${k}" onchange="live()"><option value="">—</option>${c}</select></label></div><div id="r${k}"></div><div style="margin-top:8px"><button class="btn p s" onclick="reg(${k})">Registrar ${k}ª opção</button> <button class="btn s" onclick="sgBtn(${k})">💡 Sugerir datas</button></div></div>`;
 const mv=act().filter(v=>v.pid==S.me&&pm[v.pid]).map(v=>`<li>${fm(v.i)} a ${fm(v.f)} · ${v.d}d · <span class="st">${v.st}</span></li>`).join('');
 return`<div class="res w" style="margin:0 0 8px">Você pode lançar pretensão de férias das pessoas do seu grupo. Se houver conflito, o app avisa e o pedido fica como pretensão pendente de aprovação do gestor.</div><div class="card row">${pessoaSel()}<label style="flex-direction:row;align-items:center;gap:6px;${pm[S.me]&&can(grp(pm[S.me]))?'':'display:none'}"><input type="checkbox" id="gs" ${gestor?'checked':''} onchange="gestor=this.checked">Inserir como gestor (aprova direto)</label><label style="flex-direction:row;align-items:center;gap:6px;${pm[S.me]&&can(grp(pm[S.me]))?'':'display:none'}"><input type="checkbox" id="fx">Equipe mínima (flexibiliza cobertura)</label></div>${opt(1)}${opt(2)}<h2>Férias de ${pm[S.me]?xe(pm[S.me].n):''}</h2><ul>${mv||'<li class="mu">Nenhum período registrado.</li>'}</ul>`;
}
function rd(k){const i=$('#i'+k).value;if(!i)return null;const d=+$('#d'+k).value,a=dn(i);return{a,d,f:a+d-1,c:+$('#c'+k).value||''}}
function live(){[1,2].forEach(k=>{const r=rd(k),b=$('#r'+k);if(!r){b.innerHTML='';$('#f'+k).value='';return}
 $('#f'+k).value=fm(r.f);const x=chk(S.me,r.a,r.f,0,r.c),dp=act().find(v=>v.pid==S.me&&v.i<=r.f&&v.f>=r.a);
 b.innerHTML=(dp?'<div class="res x"><b>⛔ Não permitido</b> · você já marcou férias de '+fm(dp.i)+' a '+fm(dp.f)+'. Não dá para marcar a mesma data duas vezes.</div>':x.E.length?`<div class="res x"><b>⚠ Conflito</b> · será registrado como pretensão pendente de aprovação<br>${x.E.join('<br>')}</div>`:'<div class="res v"><b>Livre</b> · nenhuma regra violada</div>')+x.W.map(w=>`<div class="res w">⚠ ${w}</div>`).join('')+(!r.c&&S.r.cobertura?'<div class="res w">Sem cobertura: ficará “Pendente de cobertura”.</div>':'')+(x.E.length?sg(k,r):'')})}
function reg(k){const r=rd(k);if(!r)return toast('Informe a data de início.');
 if(!APR&&pm[S.me]&&grp(pm[S.me])!=gMeu())return toast('Você só pode lançar férias de pessoas do seu grupo ('+GN[gMeu()]+').');
 const gp=pm[S.me]?can(grp(pm[S.me])):false,g=$('#gs').checked&&gp,fx=$('#fx').checked&&gp,R=S.rod,o=rank();
 
 const dp=act().find(v=>v.pid==S.me&&v.i<=r.f&&v.f>=r.a);if(dp)return toast('<b>⛔ Não permitido:</b> você já marcou férias de '+fm(dp.i)+' a '+fm(dp.f)+'. Não dá para marcar a mesma data duas vezes.',10000);
 const x=chk(S.me,r.a,r.f,0,r.c),cx=x.E.length>0;
 const ok=r.c||fx||!S.r.cobertura;
 S.v.push({id:Date.now(),pid:S.me,i:r.a,f:r.f,d:r.d,cob:r.c,fx,rod:R.n,st:ok?(g&&!cx?'Aprovada':'Pendente'):'Pendente de cobertura'});
 {const nv=S.v[S.v.length-1];logH('Registrou férias de '+pm[S.me].n+': '+fm(r.a)+' a '+fm(r.f)+' ('+r.d+' dias) · '+nv.st+(cx?' · com conflito':'')+(g?' · inserido como gestor':''))}sv();toast(cx?'<b>⚠ Conflito: registrado como pretensão pendente de aprovação</b><br>'+x.E.slice(0,3).join('<br>')+'<br><button class="btn s" style="margin-top:6px" onclick="sugV('+S.v[S.v.length-1].id+')">💡 Sugerir nova data</button>':'Registrado: '+S.v[S.v.length-1].st,cx?20000:7000);render()}

function xe(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function exp(){if(!APR)return toast('Só o aprovador exporta os dados.');
 const sh=(n,r)=>`<Worksheet ss:Name="${n}"><Table>${r.map(l=>'<Row>'+l.map(c=>`<Cell><Data ss:Type="String">${xe(c)}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet>`;
 const F=['id','nome','tipo','funcao','area','turma','nivel','vencimento','ultimas_ferias','saldo','painel','cargo','penultimas_ferias'],V=['pessoa_id','inicio','fim','dias','cobre_id','status','equipe_minima'];
 const x=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">`+sh('Cadastro',[F,...S.p.map(p=>[p.id,p.n,p.tp,p.f,p.a,p.t,p.nv,p.ve,p.ul,p.sal,p.pn,p.cg,p.pu||''])])+sh('Ferias',[V,...S.v.map(v=>[v.pid,ds(v.i),ds(v.f),v.d,v.cob,v.st,v.fx?1:0])])+'</Workbook>';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel'}));a.download='ferias_2027.xls';a.click();logH('Exportou os dados para Excel');toast('Exportado: ferias_2027.xls (abre no Excel).')}
function imp(el){if(!APR){toast('Só o aprovador importa dados.');el.value='';return}const f=el.files[0];if(!f)return;f.text().then(t=>{try{
 const d=new DOMParser().parseFromString(t,'text/xml'),W={};
 for(const w of d.getElementsByTagName('Worksheet'))W[w.getAttribute('ss:Name')]=[...w.getElementsByTagName('Row')].slice(1).map(r=>[...r.getElementsByTagName('Data')].map(c=>c.textContent));

 S.p=W.Cadastro.map(r=>({id:+r[0],n:r[1],tp:r[2],f:r[3],a:r[4],t:r[5],nv:r[6],ve:r[7],ul:r[8],sal:+r[9],pn:r[10],cg:r[11]||undefined,pu:r[12]||''}));mig();
 S.v=(W.Ferias||[]).map((r,k)=>({id:Date.now()+k,pid:+r[0],i:dn(r[1]),f:dn(r[2]),d:+r[3],cob:+r[4]||'',st:r[5],fx:r[6]=='1'}));

render();

const cs=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
let DB=null,RM={p:{},v:{},c:null},SENT={p:{},v:{},c:null},rdy={p:0,v:0,c:0},pend=false,first=true;
const net=t=>{const e=$('#net');if(e)e.textContent=t};
function push(){if(!DB||first)return;const ops=[];
 const dif=(col,arr,k)=>{const nw={};arr.forEach(o=>nw[o.id]=cs(o));
  for(const id in nw)if(SENT[k][id]!==nw[id]){SENT[k][id]=nw[id];ops.push(DB.collection(col).doc(String(id)).set(JSON.parse(nw[id])))}
  for(const id in SENT[k])if(!(id in nw)){delete SENT[k][id];ops.push(DB.collection(col).doc(String(id)).delete())}};
 dif('ferias',S.v,'v');dif('pessoas',S.p,'p');
 const c=cs({r:S.r,rod:S.rod,anc:S.anc,pin:S.pin||'',fo:S.fo||{},fp:S.fp||{},mc:S.mc||{}});
 if(SENT.c!==c){SENT.c=c;ops.push(DB.doc('cfg/main').set({...JSON.parse(c),seeded:true}).catch(e=>{SENT.c=RM.c;if(S.tab=='Regras'||S.tab=='Aprovação')toast('Só o gestor/editor altera as regras, a escala e o PIN.')}))}
 if(ops.length)Promise.all(ops).then(()=>net('🟢 online')).catch(e=>{toast('Sem permissão para salvar isso (cadastro, regras e rodadas só o gestor/editor altera). Voltando ao estado compartilhado.');SENT={p:{...RM.p},v:{...RM.v},c:RM.c};if(RM.c!=null)applyRemote()})}
function applyRemote(){S.v=Object.values(RM.v).map(s=>JSON.parse(s)).sort((a,b)=>a.id-b.id);S.p=Object.values(RM.p).map(s=>JSON.parse(s)).sort((a,b)=>a.id-b.id);
 if(RM.c){const c=JSON.parse(RM.c);S.r={...S.r,...c.r};S.rod=c.rod||S.rod;S.anc=c.anc||S.anc;S.pin=c.pin||'';S.fo=c.fo||{};S.fp=c.fp||{};S.mc=c.mc||{}}
 mig();ls();refresh()}
function refresh(){if(needGate())return;if(S.tab=='Pretensão'){pm={};S.p.forEach(p=>pm[p.id]=p);if(pm[S.me])live();return}
 const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pend=true;return}render()}
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){pend=false;render()}},250)});
function ing(){if(!(rdy.p&&rdy.v&&rdy.c))return;

 applyRemote();net('🟢 online')}
(async()=>{try{

 try{UU=await claude.use('user');if(UU){const m=await UU.me();UID=m.id||''}}catch(e){}

 const col=(c,k)=>DB.collection(c).onSnapshot(s=>{RM[k]={};s.docs.forEach(d=>RM[k][d.id]=cs(d.data()));SENT[k]={...RM[k]};rdy[k]=1;ing()},er);
 col('ferias','v');col('pessoas','p');

 setTimeout(()=>{if(first)net('⚪ sem conexão — dados locais')},10000);
}catch(e){net('⚪ local')}})();
